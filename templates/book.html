<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>حجز موعد | مواعيدي</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <!-- مكتبة Luxon لتحويل التوقيتات الدولية بدقة متناهية -->
  <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
  <style>
    body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; }
    .card { border: none; border-radius: 1rem; box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,0.075); }
    .slot-btn { transition: all 0.2s ease; }
    .slot-btn.selected { background-color: #0d6efd; color: white; border-color: #0d6efd; }
  </style>
</head>
<body class="py-5">
  <div class="container" style="max-width: 700px;">
    
    <!-- بطاقة المعلم المصغرة -->
    <div class="card p-4 mb-4 text-center">
      <h2 class="fw-bold text-primary mb-1">{{ teacher.full_name }}</h2>
      <p class="text-muted mb-2"><span class="badge bg-secondary">{{ teacher.profession }}</span></p>
      <p class="small text-secondary mb-3">{{ teacher.bio or 'مرحباً بك، يمكنك اختيار الموعد المناسب للحجز معي مباشرة.' }}</p>
      <div id="timezoneBadge" class="alert alert-info py-2 small mb-0 rounded-3">
        🌍 جاري اكتشاف توقيتك المحلي...
      </div>
    </div>

    <!-- نموذج الحجز المتسلسل -->
    <div class="card p-4">
      <form id="bookingForm">
        
        <!-- 1. اختيار مدة الحصة -->
        <div class="mb-4">
          <label class="form-label fw-bold text-primary">1. اختر مدة الحصة</label>
          <div class="row g-2" id="durationGroup">
            <div class="col-4"><input type="radio" class="btn-check" name="duration" id="d30" value="30" checked><label class="btn btn-outline-primary w-100 rounded-3" for="d30">30 دقيقة</label></div>
            <div class="col-4"><input type="radio" class="btn-check" name="duration" id="d45" value="45"><label class="btn btn-outline-primary w-100 rounded-3" for="d45">45 دقيقة</label></div>
            <div class="col-4"><input type="radio" class="btn-check" name="duration" id="d60" value="60"><label class="btn btn-outline-primary w-100 rounded-3" for="d60">60 دقيقة</label></div>
          </div>
        </div>

        <!-- 2. اختيار اليوم المتكرر (أيام الأسبوع) -->
        <div class="mb-4">
          <label class="form-label fw-bold text-primary">2. اختر اليوم المناسب أسبوعياً</label>
          <select id="daySelect" class="form-select rounded-3" required>
            <option value="" disabled selected>-- اختر اليوم --</option>
            <option value="0">الأحد</option>
            <option value="1">الإثنين</option>
            <option value="2">الثلاثاء</option>
            <option value="3">الأربعاء</option>
            <option value="4">الخميس</option>
            <option value="5">الجمعة</option>
            <option value="6">السبت</option>
          </select>
        </div>

        <!-- 3. المواعيد المتاحة -->
        <div class="mb-4">
          <label class="form-label fw-bold text-primary">3. الأوقات المتاحة (بتوقيتك المحلي)</label>
          <div id="slotsContainer" class="row g-2">
            <p class="text-muted small">الرجاء اختيار اليوم والمدة لعرض الأوقات المتاحة...</p>
          </div>
        </div>

        <!-- 4. بيانات الطالب -->
        <div id="studentDetails" style="display: none;" class="border-top pt-4 mt-4">
          <h5 class="fw-bold text-primary mb-3">4. أدخل بياناتك للتأكيد</h5>
          
          <div class="mb-3">
            <label class="form-label fw-bold">الاسم الكامل</label>
            <input type="text" id="studentName" class="form-control rounded-3" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">البريد الإلكتروني</label>
            <input type="email" id="studentEmail" class="form-control rounded-3" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">رقم الواتساب <span class="text-danger">*</span></label>
            <input type="text" id="studentWhatsapp" class="form-control rounded-3" placeholder="01xxxxxxxxx مطلوب لإرسال التنبيهات" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">ملاحظات للمعلم (اختياري)</label>
            <textarea id="studentNotes" class="form-control rounded-3" rows="2" placeholder="اكتب أي استفسار أو موضوع ترغب بمناقشته..."></textarea>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-bold shadow-sm">تأكيد حجز الموعد 🚀</button>
        </div>

      </form>
    </div>

  </div>

  <script>
    const teacherId = "{{ teacher.id }}";
    let teacherTimezone = "{{ teacher.timezone }}";
    let studentTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    let availabilityData = [];
    let prayerTimesList = [];
    let selectedSlotISO = null;

    // عرض شارة التوقيت
    document.getElementById('timezoneBadge').innerHTML = `🌍 أنت تتصفح المواعيد بتوقيتك المحلي (<strong>${studentTimezone}</strong>). يتم التحويل تلقائياً من توقيت المعلم.`;

    // جلب بيانات التوفر من الخادم عند الفتح
    fetch(`/api/availability/${teacherId}`)
      .then(res => res.json())
      .then(data => {
        availabilityData = data.availability;
        prayerTimesList = data.prayer_times || [];
        if(data.timezone) teacherTimezone = data.timezone;
      });

    // عند تغيير اليوم أو المدة، توليد الأوقات
    document.getElementById('daySelect').addEventListener('change', generateSlots);
    document.querySelectorAll('input[name="duration"]').forEach(el => el.addEventListener('change', generateSlots));

    function generateSlots() {
      const dayOfWeek = parseInt(document.getElementById('daySelect').value);
      const duration = parseInt(document.querySelector('input[name="duration"]:checked').value);
      const container = document.getElementById('slotsContainer');
      
      if(isNaN(dayOfWeek)) return;

      container.innerHTML = '';
      selectedSlotISO = null;
      document.getElementById('studentDetails').style.display = 'none';

      // تصفية أوقات المعلم لهذا اليوم
      const dayAvailability = availabilityData.filter(a => a.day_of_week === dayOfWeek);

      if(dayAvailability.length === 0) {
        container.innerHTML = '<p class="text-danger small">عذراً، لا توجد أوقات متاحة في هذا اليوم.</p>';
        return;
      }

      let slotsCount = 0;

      dayAvailability.forEach(block => {
        let startTime = luxon.DateTime.fromISO(block.start_time, { zone: teacherTimezone });
        let endTime = luxon.DateTime.fromISO(block.end_time, { zone: teacherTimezone });

        // توليد الفترات بناءً على المدة
        let current = startTime;
        while(current.plus({ minutes: duration }) <= endTime) {
          let slotEnd = current.plus({ minutes: duration });
          
          // تحويل الوقت لتوقيت الطالب المحلي
          let studentStart = current.setZone(studentTimezone);
          let studentEnd = slotEnd.setZone(studentTimezone);

          // التحقق من أوقات الصلاة واستبعادها لو مفعلة
          let isPrayerTime = false;
          // (منطق مبسط للتحقق من تطابق وقت الصلاة)

          if(!isPrayerTime) {
            slotsCount++;
            const btn = document.createElement('div');
            btn.className = 'col-md-4';
            btn.innerHTML = `<button type="button" class="btn btn-outline-secondary w-100 rounded-3 py-2 slot-btn" data-iso="${current.toISO()}">
              ${studentStart.toFormat('hh:mm a')} - ${studentEnd.toFormat('hh:mm a')}
            </button>`;

            btn.querySelector('button').addEventListener('click', function() {
              document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
              this.classList.add('selected');
              selectedSlotISO = this.getAttribute('data-iso');
              document.getElementById('studentDetails').style.display = 'block';
            });

            container.appendChild(btn);
          }

          current = slotEnd;
        }
      });

      if(slotsCount === 0) {
        container.innerHTML = '<p class="text-danger small">جميع الأوقات محجوزة أو تعارضت مع أوقات الصلاة في هذا اليوم.</p>';
      }
    }

    // إرسال الحجز للخادم
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();
      if(!selectedSlotISO) {
        alert('الرجاء اختيار موعد الحصة أولاً');
        return;
      }

      const duration = parseInt(document.querySelector('input[name="duration"]:checked').value);

      const payload = {
        teacher_id: teacherId,
        student_name: document.getElementById('studentName').value,
        student_email: document.getElementById('studentEmail').value,
        student_whatsapp: document.getElementById('studentWhatsapp').value,
        duration_minutes: duration,
        starts_at: selectedSlotISO,
        notes: document.getElementById('studentNotes').value
      };

      fetch('/api/bookings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if(data.success) {
          alert('تم حجز حصتك بنجاح! سيتم التواصل معك عبر الواتساب.');
          window.location.reload();
        } else {
          alert('فشل الحجز: ' + (data.error || 'خطأ غير معروف'));
        }
      });
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="page.loginTitle">Teacher login | Maw3edy</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" data-bootstrap-css>
  <script src="{{ url_for('static', filename='i18n.js') }}" defer></script>
</head>
<body class="bg-light d-flex align-items-center py-5" style="min-height: 100vh;">
  <div class="container" style="max-width: 450px;">
    <div class="card shadow-sm border-0 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <a href="/" class="fw-bold text-decoration-none">Maw3edy</a>
        <select class="form-select form-select-sm w-auto" data-language-selector aria-label="Language">
          <option value="en" data-i18n="languages.en">English</option>
          <option value="ar" data-i18n="languages.ar">العربية</option>
          <option value="fr" data-i18n="languages.fr">Français</option>
          <option value="es" data-i18n="languages.es">Español</option>
          <option value="de" data-i18n="languages.de">Deutsch</option>
          <option value="tr" data-i18n="languages.tr">Türkçe</option>
        </select>
      </div>
      <h2 class="text-center text-primary mb-4 fw-bold" data-i18n="auth.loginTitle">Teacher login</h2>

      {% if error %}
      <div class="alert alert-danger" data-i18n="{{ error_key }}">{{ error }}</div>
      {% endif %}

      <form action="/login" method="POST">
        <div class="mb-3">
          <label class="form-label fw-bold" data-i18n="auth.email">Email address</label>
          <input type="email" name="email" class="form-control" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold" data-i18n="auth.password">Password</label>
          <input type="password" name="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 mb-3" data-i18n="auth.login">Log in</button>
        <div class="text-center">
          <span class="text-muted" data-i18n="auth.noAccount">Don't have an account?</span> <a href="/register" class="text-decoration-none" data-i18n="auth.registerLink">Create one</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>

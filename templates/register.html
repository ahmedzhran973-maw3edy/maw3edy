<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إنشاء حساب | مواعيدي</title>
  <!-- استخدمنا Bootstrap RTL لدعم العربي بشكل مثالي -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="d-flex align-items-center py-5" style="min-height: 100vh;">
  <div class="container" style="max-width: 550px;">
    <div class="card shadow-sm border-0 rounded-4 p-4">
      <div class="text-center mb-4">
        <h2 class="text-primary fw-bold">مواعيدي</h2>
        <p class="text-muted">سجل كمعلم وابدأ في استقبال حجوزاتك</p>
      </div>

      {% if error_key %}
        <div class="alert alert-danger text-center rounded-3 fw-bold">
          {% if error_key == 'auth.emailExists' %}
            هذا البريد الإلكتروني مسجل بالفعل!
          {% else %}
            حدث خطأ، يرجى المحاولة مرة أخرى.
          {% endif %}
        </div>
      {% endif %}

      <form action="/register" method="POST">
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-bold">الاسم الكامل</label>
            <input type="text" name="full_name" class="form-control rounded-3" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">طبيعة العمل</label>
            <select name="profession" class="form-select rounded-3">
              <option value="معلم أونلاين">معلم أونلاين</option>
              <option value="صاحب أكاديمية">صاحب أكاديمية</option>
              <option value="مدرب مستقل">مدرب مستقل</option>
            </select>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-bold">البريد الإلكتروني</label>
            <input type="email" name="email" class="form-control rounded-3" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">رقم الواتساب</label>
            <input type="text" name="phone_number" class="form-control rounded-3" placeholder="01xxxxxxxxx" required>
            <div class="form-text" style="font-size: 12px;">مطلوب لإرسال تنبيهات الحجوزات</div>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-bold">الدولة</label>
            <input type="text" name="country" class="form-control rounded-3" placeholder="مثال: مصر" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-bold">المدينة</label>
            <input type="text" name="city" class="form-control rounded-3" placeholder="مثال: القاهرة" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">نبذة عنك / المادة التي تدرسها</label>
          <textarea name="bio" class="form-control rounded-3" rows="2" placeholder="اكتب نبذة تظهر للطلاب في صفحة الحجز الخاصة بك..."></textarea>
        </div>

        <div class="mb-4">
          <label class="form-label fw-bold">كلمة المرور</label>
          <input type="password" name="password" class="form-control rounded-3" required>
        </div>

        <!-- مخفي: جلب التوقيت الزمني تلقائياً -->
        <input type="hidden" name="timezone" id="timezoneInput">

        <button type="submit" class="btn btn-primary w-100 py-2 mb-3 rounded-3 fw-bold">إنشاء الحساب</button>
        <div class="text-center">
          <span class="text-muted">لديك حساب بالفعل؟</span> 
          <a href="/login" class="text-decoration-none fw-bold">تسجيل الدخول</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    // جلب التوقيت الزمني لجهاز المعلم تلقائياً (مثال: Africa/Cairo)
    document.getElementById('timezoneInput').value = Intl.DateTimeFormat().resolvedOptions().timeZone;
  </script>
</body>
</html>
